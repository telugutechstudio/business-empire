<body data-world="earth">
<noscript>
  <div class="noscript">
    <h1>Business Empire – Free Idle Business Game (Telugu &amp; English)</h1>
    <p>Start with a tea stall and grow a business empire: buy food trucks, coffee shops, hotels, film studios and a space agency. Hire managers, buy upgrades, spin the lucky wheel, celebrate Sankranti, Ugadi, Dasara and Diwali, travel to the Moon and Mars and climb the online leaderboard.</p>
    <p>టీ స్టాల్‌తో మొదలుపెట్టి మీ బిజినెస్ సామ్రాజ్యాన్ని పెంచండి. మేనేజర్లను నియమించండి, లక్కీ వీల్ తిప్పండి, పండుగలు జరుపుకోండి, చంద్రుడు, అంగారకుడికి వెళ్ళండి.</p>
    <p><b>Please turn on JavaScript to play.</b></p>
  </div>
</noscript>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="nebula" aria-hidden="true"></div>

<div id="app">
  <header class="topbar">
    <button class="brand" data-act="tab" data-tab="slots" title="Spin Game">
      <span class="brand-logo" id="worldIco"></span>
      <span class="brand-name">Business<b>Empire</b><small id="worldName">Earth</small></span>
    </button>
    <div class="cash-wrap">
      <div class="cash-row"><span data-ico="coin" class="cash-coin"></span><div id="cash" class="cash">0</div></div>
      <div id="ips" class="ips">0 / sec</div>
    </div>
    <div class="currencies">
      <div class="pill inv" title="Investors (each boosts all profits)"><span data-ico="necktie"></span><b id="investors">0</b><small id="investorBonus">+0%</small></div>
      <div class="pill gem" title="Gems"><span data-ico="gem"></span><b id="gems">0</b></div>
      <button class="music-btn" id="musicBtn" data-act="music" aria-label="Music"><span data-ico="notes"></span></button>
    </div>
  </header>

  <nav class="side" id="nav">
    <button class="tab-btn active" data-act="tab" data-tab="slots"><span data-ico="slot"></span><em data-t="Spin Game|స్పిన్ గేమ్">Spin Game</em><i class="dot" id="dot-slots"></i></button>
    <button class="tab-btn" data-act="tab" data-tab="build"><span data-ico="construction"></span><em data-t="Landmarks|ల్యాండ్‌మార్కులు">Landmarks</em><i class="dot" id="dot-build"></i></button>
    <button class="tab-btn" data-act="tab" data-tab="album"><span data-ico="album"></span><em data-t="Album|ఆల్బమ్">Album</em><i class="dot" id="dot-album"></i></button>
    <button class="tab-btn" data-act="tab" data-tab="missions"><span data-ico="clipboard"></span><em data-t="Missions|మిషన్లు">Missions</em><i class="dot" id="dot-missions"></i></button>
    <button class="tab-btn" data-act="tab" data-tab="pets"><span data-ico="paws"></span><em data-t="Pets|పెట్స్">Pets</em><i class="dot" id="dot-pets"></i></button>
    <button class="tab-btn" data-act="tab" data-tab="leaderboard"><span data-ico="trophy"></span><em data-t="Leaderboard|లీడర్‌బోర్డ్">Leaderboard</em></button>
    <button class="tab-btn" data-act="tab" data-tab="shop"><span data-ico="gem"></span><em data-t="Gem Shop|జెమ్ షాప్">Gem Shop</em></button>
    <button class="tab-btn" data-act="tab" data-tab="awards"><span data-ico="medal"></span><em data-t="Awards|అవార్డులు">Awards</em></button>
    <button class="tab-btn" data-act="tab" data-tab="stats"><span data-ico="bars"></span><em data-t="Stats|గణాంకాలు">Stats</em></button>
    <button class="tab-btn" data-act="tab" data-tab="settings"><span data-ico="gear"></span><em data-t="Settings|సెట్టింగ్‌లు">Settings</em></button>
  </nav>

  <div class="boostbar" id="boostbar">
    <button class="hype" id="hypeBtn" data-act="hype">Hype!</button>
    <button class="hype daily" data-act="daily"><span data-ico="gift"></span> <span data-t="Daily|డైలీ">Daily</span><i class="dot" id="dot-daily"></i></button>
    <button class="hype spin" data-act="spin"><span data-ico="wheel"></span> <span data-t="Spin|స్పిన్">Spin</span><i class="dot" id="dot-spin"></i></button>
    <button class="hype scratch" data-act="scratch"><span data-ico="ticket"></span> <span data-t="Scratch|స్క్రాచ్">Scratch</span><i class="dot" id="dot-scratch"></i></button>
    <button class="hype ad hidden" id="adBtn" data-act="ad"><span data-ico="tv"></span> <span data-t="x2 Free|x2 ఫ్రీ">x2 Free</span></button>
    <button class="hype install hidden" id="installBtn" data-act="install"><span data-ico="phone"></span> <span data-t="Install|ఇన్‌స్టాల్">Install</span></button>
    <button class="hype share" data-act="share"><span data-ico="letter"></span> <span data-t="Share|షేర్">Share</span></button>
    <div class="chips" id="chips"></div>
  </div>

  <main id="main">
    <section class="tab" id="tab-business">
      <div class="buymode" id="buymode">
        <span data-t="Buy|కొను">Buy</span>
        <button data-act="buymode" data-mode="1">x1</button>
        <button data-act="buymode" data-mode="10">x10</button>
        <button data-act="buymode" data-mode="100">x100</button>
        <button data-act="buymode" data-mode="next" data-t="Next|తర్వాత">Next</button>
        <button data-act="buymode" data-mode="max" data-t="Max|గరిష్టం">Max</button>
      </div>
      <div id="bizList" class="biz-list"></div>
    </section>
    <section class="tab active" id="tab-slots"></section>
    <section class="tab" id="tab-build"></section>
    <section class="tab" id="tab-album"></section>
    <section class="tab" id="tab-missions"></section>
    <section class="tab" id="tab-managers"></section>
    <section class="tab" id="tab-upgrades"></section>
    <section class="tab" id="tab-investors"></section>
    <section class="tab" id="tab-pets"></section>
    <section class="tab" id="tab-stocks"></section>
    <section class="tab" id="tab-worlds"></section>
    <section class="tab" id="tab-leaderboard"></section>
    <section class="tab" id="tab-shop"></section>
    <section class="tab" id="tab-awards"></section>
    <section class="tab" id="tab-stats"></section>
    <section class="tab" id="tab-settings"></section>
  </main>

  <div class="ticker"><span class="ticker-label" data-t="NEWS|వార్తలు">NEWS</span><div class="ticker-track"><span id="tickerText" data-t="Welcome, boss! Tap the Tea Stall to start earning.|స్వాగతం బాస్! సంపాదించడానికి టీ స్టాల్ ట్యాప్ చేయండి.">Welcome, boss! Tap the Tea Stall to start earning.</span></div></div>
</div>

<button id="briefcase" class="briefcase hidden" data-act="briefcase" aria-label="Golden briefcase"><span data-ico="briefcase"></span></button>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="tutHand" class="tut-hand hidden" aria-hidden="true"><span data-ico="hand"></span></div>
<div id="tutor" class="tutor hidden" role="status">
  <span data-ico="grad" class="tutor-ico"></span>
  <div id="tutorText" class="tutor-text"></div>
  <div class="tutor-btns"><button class="btn gold hidden" id="tutorNext" data-act="tut-next">Finish</button><button class="btn ghost" id="tutorSkip" data-act="tut-skip">Skip</button></div>
</div>
<div id="toasts" class="toasts"></div>
